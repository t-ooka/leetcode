name: LeetCode のレビュー依頼を作成
description: 問題 URL と step 1〜3 のコードからレビュー用 PR を自動作成します
title: "[LeetCode] "
body:
  - type: markdown
    attributes:
      value: |
        問題 URL、言語、3 段階のコードを入力してください。
        Issue を作成すると、専用ブランチと Pull Request が自動で作られます。

  - type: input
    id: problem_url
    attributes:
      label: Problem URL
      description: LeetCode の問題ページの URL
      placeholder: https://leetcode.com/problems/two-sum/
    validations:
      required: true

  - type: dropdown
    id: language
    attributes:
      label: Language
      options:
        - Python
        - Ruby
        - C++
    validations:
      required: true

  - type: textarea
    id: step1
    attributes:
      label: Step 1
      description: まず Accepted になったコード（コードフェンスは不要です）
      placeholder: コードを貼り付けてください
    validations:
      required: true

  - type: textarea
    id: step2
    attributes:
      label: Step 2
      description: 読みやすく整えたコード（コードフェンスは不要です）
      placeholder: コードを貼り付けてください
    validations:
      required: true

  - type: textarea
    id: step3
    attributes:
      label: Step 3
      description: 時間を測って書き直した最終コード（コードフェンスは不要です）
      placeholder: コードを貼り付けてください
    validations:
      required: true

  - type: textarea
    id: explanation
    attributes:
      label: Explanation (memo.md)
      description: 各ステップで考えたこと、選んだ解法、計算量、疑問点などを Markdown で記入してください
      placeholder: |
        # step1

        最初に考えたことや詰まった点

        # step2

        読みやすくするために変更したこと、他の解法との比較

        # step3

        書き直して気づいたこと

        時間計算量: O(...)
        空間計算量: O(...)
    validations:
      required: true
