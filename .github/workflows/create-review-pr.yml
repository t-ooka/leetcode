name: Create LeetCode review PR

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  create-pr:
    if: startsWith(github.event.issue.title, '[LeetCode] ')
    runs-on: ubuntu-latest
    steps:
      - name: Create branch, files, and pull request
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue = context.payload.issue;
            const allowedAssociations = new Set(['OWNER', 'MEMBER', 'COLLABORATOR']);

            if (!allowedAssociations.has(issue.author_association)) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issue.number,
                body: 'この自動化はリポジトリへの書き込み権限があるユーザーだけが実行できます。',
              });
              return;
            }

            const sectionLabels = [
              'Problem URL',
              'Language',
              'Step 1',
              'Step 2',
              'Step 3',
              'Explanation (memo.md)',
            ];

            function field(label) {
              const marker = `### ${label}`;
              const start = issue.body.indexOf(marker);
              if (start === -1) return '';

              const contentStart = start + marker.length;
              const nextLabel = sectionLabels[sectionLabels.indexOf(label) + 1];
              const nextMarker = nextLabel
                ? issue.body.indexOf(`\n### ${nextLabel}`, contentStart)
                : -1;
              const end = nextMarker === -1 ? issue.body.length : nextMarker;
              return issue.body.slice(contentStart, end).trim();
            }

            const problemUrl = field('Problem URL');
            const language = field('Language');
            const steps = [field('Step 1'), field('Step 2'), field('Step 3')];
            const explanation = field('Explanation (memo.md)');

            let parsedUrl;
            try {
              parsedUrl = new URL(problemUrl);
            } catch {
              core.setFailed('Problem URL が正しい URL ではありません。');
              return;
            }

            const hostIsLeetCode = ['leetcode.com', 'www.leetcode.com'].includes(parsedUrl.hostname);
            const slugMatch = parsedUrl.pathname.match(/^\/problems\/([a-z0-9-]+)(?:\/.*)?$/i);
            if (!hostIsLeetCode || !slugMatch) {
              core.setFailed('https://leetcode.com/problems/<problem-name>/ 形式の URL を入力してください。');
              return;
            }

            if (steps.some((code) => !code || code === '_No response_')) {
              core.setFailed('Step 1〜3 のコードをすべて入力してください。');
              return;
            }
            if (!explanation || explanation === '_No response_') {
              core.setFailed('解説文を入力してください。');
              return;
            }

            // Add another entry here when supporting a new language.
            const supportedLanguages = {
              Python: { extension: 'py' },
              Ruby: { extension: 'rb' },
              'C++': { extension: 'cpp' },
            };
            const extension = supportedLanguages[language]?.extension;
            if (!extension) {
              core.setFailed(`未対応の言語です: ${language}`);
              return;
            }

            const slug = slugMatch[1].toLowerCase();
            const smallWords = new Set(['a', 'an', 'and', 'as', 'at', 'by', 'for', 'from', 'in', 'of', 'on', 'or', 'the', 'to']);
            const romanNumbers = { i: '1', ii: '2', iii: '3', iv: '4', v: '5' };
            const words = slug.split('-');
            const problemTitle = words.map((word, index) => {
              if (romanNumbers[word]) return romanNumbers[word];
              if (index > 0 && smallWords.has(word)) return word;
              return word.charAt(0).toUpperCase() + word.slice(1);
            }).join(' ');

            const { data: repository } = await github.rest.repos.get({ owner, repo });
            const baseBranch = repository.default_branch;
            const { data: baseRef } = await github.rest.git.getRef({
              owner,
              repo,
              ref: `heads/${baseBranch}`,
            });
            const { data: baseCommit } = await github.rest.git.getCommit({
              owner,
              repo,
              commit_sha: baseRef.object.sha,
            });

            async function pathExists(path) {
              try {
                await github.rest.repos.getContent({ owner, repo, path, ref: baseBranch });
                return true;
              } catch (error) {
                if (error.status === 404) return false;
                throw error;
              }
            }

            let directory = problemTitle;
            if (await pathExists(directory)) {
              directory = `${problemTitle} (retry)`;
              let retry = 2;
              while (await pathExists(directory)) {
                directory = `${problemTitle} (retry ${retry})`;
                retry += 1;
              }
            }

            const branch = `question/${slug}-${issue.number}`;
            const tree = steps.map((code, index) => ({
              path: `${directory}/step${index + 1}.${extension}`,
              mode: '100644',
              type: 'blob',
              content: `${code.replace(/\r\n/g, '\n')}\n`,
            }));
            tree.push({
              path: `${directory}/memo.md`,
              mode: '100644',
              type: 'blob',
              content: `${explanation.replace(/\r\n/g, '\n')}\n`,
            });

            const { data: createdTree } = await github.rest.git.createTree({
              owner,
              repo,
              base_tree: baseCommit.tree.sha,
              tree,
            });
            const { data: commit } = await github.rest.git.createCommit({
              owner,
              repo,
              message: `Add ${problemTitle} solutions`,
              tree: createdTree.sha,
              parents: [baseRef.object.sha],
            });
            await github.rest.git.createRef({
              owner,
              repo,
              ref: `refs/heads/${branch}`,
              sha: commit.sha,
            });

            const { data: pull } = await github.rest.pulls.create({
              owner,
              repo,
              head: branch,
              base: baseBranch,
              title: problemTitle,
              body: [
                `## Problem`,
                '',
                problemUrl,
                '',
                `## Steps`,
                '',
                `- step 1: Accepted になるコード`,
                `- step 2: 読みやすく整えたコード`,
                `- step 3: 時間を測って書き直したコード`,
                `- memo.md: 解法や計算量などの解説`,
                '',
                `Closes #${issue.number}`,
              ].join('\n'),
            });

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: issue.number,
              body: `レビュー用 PR を作成しました: #${pull.number}`,
            });
